# Cloudflare Workers configuration for the Agently backend.
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/
name = "agently-home-hub-api"
main = "src/worker.ts"
compatibility_date = "2025-01-01"

# Serve the built frontend (single-page app) from the same worker when present.
# `npm run build` in the repo root emits the Vite bundle to ../dist.
#[assets]
 # directory = "../dist"
 # binding = "ASSETS"
 # not_found_handling = "single-page-application"
 # run_worker_first = ["/api", "/api/*"]

# ---------------------------------------------------------------
# Bindings (resolve against secrets via .dev.vars locally and
# `wrangler secret put` in production).
# ---------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "agently-hub-db"
database_id = "3d2dffbe-06b5-40c7-93c6-278f7541227a"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "147e7ffb2f3240b0aeae613dd6b3821a"

# Optional bindings — only ACTIVE when their credentials are configured.
# kv_namespaces = [
#   { binding = "RATE_LIMIT", id = "147e7ffb2f3240b0aeae613dd6b3821a" }
# ]
# r2_buckets = [
#   { binding = "FILES", bucket_name = "agently-uploads" }
# ]

[vars]
ENVIRONMENT = "production"
# Secret placeholders (override with `.dev.vars` / `wrangler secret put`)
JWT_SECRET = "replace-me-with-a-strong-secret"
JWT_REFRESH_SECRET = "replace-me-with-a-refresh-secret"

observability = { enabled = true }

[env.dev]
[env.dev.vars]
ENVIRONMENT = "development"
# allow any origin in local dev
ALLOWED_ORIGINS = "*"

