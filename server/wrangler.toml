# Cloudflare Worker configuration for the Agently API.
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "agently-api"
main = "workers/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "AGENTLY_D1"
database_name = "agently-db"
database_id = "" # run: npx wrangler d1 create agently-db

# Environment variables (non-secret) — secrets are set with `wrangler secret put`
[vars]
ALLOWED_ORIGINS = "*"
JWT_ACCESS_TTL = "1h"
JWT_REFRESH_TTL_DAYS = "7"
PAYSTACK_BASE_URL = "https://api.paystack.co"
PAYSTACK_ENABLED = "false"
BOOKING_FEE_NGN = "0"
FRONTEND_URL = "https://your-frontend.vercel.app"

# Secrets to bind (each via `wrangler secret put <NAME>`):
#   JWT_SECRET
#   JWT_REFRESH_SECRET
#   PAYSTACK_SECRET_KEY
#   PAYSTACK_PUBLIC_KEY
