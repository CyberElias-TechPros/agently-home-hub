name: Deploy

# The API is deployed first and the frontend second: the frontend only ever
# talks to the API through a rewrite, so shipping it against an API revision
# that does not exist yet would break the site.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_api:
        description: 'Skip the API deploy'
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api:
    name: Deploy API to Cloudflare Workers
    if: ${{ !inputs.skip_api }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Apply migrations to staging
        if: false
        # Enabled once a staging D1 database exists; see docs/DEPLOYMENT.md.
        working-directory: worker
        run: npx wrangler d1 migrations apply agently-db --env staging --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        working-directory: worker
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  frontend:
    name: Deploy frontend to Vercel
    needs: [api]
    if: ${{ always() && (needs.api.result == 'success' || needs.api.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        run: npx vercel deploy --prod --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
