name: CI

on:
  pull_request:
  push:
    branches: [main]

# Earlier revisions of this pipeline ran every check with `|| true`, which meant
# a red build could never fail the pipeline. Nothing here is allowed to fail
# silently: if a check is not worth gating on, it should not be in CI at all.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://agently.app' }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 3

  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Type check
        working-directory: worker
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: worker
        run: npm run test

      - name: End-to-end tests
        # Runs the whole HTTP surface against a real Worker with simulated
        # D1, R2, KV and Queues. No credentials required.
        working-directory: worker
        run: npm run test:e2e

      - name: Verify the production bundle builds
        working-directory: worker
        run: npx wrangler deploy --env production --dry-run --outdir dist-dry-run
