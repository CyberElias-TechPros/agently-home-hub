name: Deploy backend

# Deploys the agently-home-hub-api worker on push to main (cyberelias-tk
# account). Applies outstanding D1 migrations (workers/migrations/*.sql)
# before every deploy, so new migration files ship automatically with the
# code that needs them. NOTE: workers/migrations/0000_drop.sql.SKIP is a
# dev-only wipe and must NEVER be renamed back to *.sql.
# Requires repo secrets CF_API_TOKEN + CF_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CF_API_TOKEN / CF_ACCOUNT_ID repo secrets (cyberelias-tk account)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply agently-hub-worker-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy
      - name: Verify health
        run: |
          body="$(curl -fsS https://agently-home-hub-api.cyberelias-tk.workers.dev/health)"
          echo "$body"
          echo "$body" | grep -q '"status":"ok"' || {
            echo "::error::agently-home-hub-api health check failed"; exit 1; }
